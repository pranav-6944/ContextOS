<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60">
  <defs>
    <!-- Brushed Titanium Gradient -->
    <linearGradient id="chassisGradSrc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="3%" stop-color="#718096" />
      <stop offset="6%" stop-color="#2d3748" />
      <stop offset="95%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#0f141c" />
    </linearGradient>

    <!-- Inset Well Shadow -->
    <linearGradient id="wellGradSrc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0d13" />
      <stop offset="50%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#1f2735" />
    </linearGradient>

    <!-- Diode Glow Gradient -->
    <radialGradient id="cyanDiodeSrc" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00f0ff" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#082f49" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="logoShadowSrc" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Main Machined Chassis Plate -->
  <rect x="4" y="4" width="232" height="52" rx="10" fill="url(#chassisGradSrc)" stroke="#4a5568" stroke-width="1.2" filter="url(#logoShadowSrc)" />
  <rect x="6" y="6" width="228" height="48" rx="8" fill="none" stroke="#2d3748" stroke-width="1" />

  <!-- Four Precision Screws -->
  <g fill="#a0aec0" stroke="#1a202c" stroke-width="0.5">
    <circle cx="12" cy="12" r="2.2" fill="#718096" />
    <line x1="10.5" y1="12" x2="13.5" y2="12" stroke="#1a202c" stroke-width="0.8" />
    <circle cx="228" cy="12" r="2.2" fill="#718096" />
    <line x1="226.5" y1="12" x2="229.5" y2="12" stroke="#1a202c" stroke-width="0.8" />
    <circle cx="12" cy="48" r="2.2" fill="#4a5568" />
    <line x1="10.5" y1="48" x2="13.5" y2="48" stroke="#1a202c" stroke-width="0.8" />
    <circle cx="228" cy="48" r="2.2" fill="#4a5568" />
    <line x1="226.5" y1="48" x2="229.5" y2="48" stroke="#1a202c" stroke-width="0.8" />
  </g>

  <!-- Left Icon Aperture -->
  <rect x="22" y="14" width="32" height="32" rx="7" fill="url(#wellGradSrc)" stroke="#0f141c" stroke-width="1.5" />
  <!-- Illuminated Diode -->
  <circle cx="38" cy="30" r="8" fill="url(#cyanDiodeSrc)" stroke="#00f0ff" stroke-width="1" />
  <circle cx="36" cy="28" r="3" fill="#ffffff" opacity="0.75" />

  <!-- Brand Typography -->
  <text x="64" y="34" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
    Context<tspan fill="#00f0ff">OS</tspan>
  </text>
  
  <!-- Subtitle Tag -->
  <text x="65" y="44" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#718096" letter-spacing="1.5">
    LOCAL RAG CONSOLE // MK-IV
  </text>

  <!-- Active Power Diode -->
  <circle cx="214" cy="30" r="3.5" fill="#10b981" stroke="#059669" stroke-width="0.8" />
  <circle cx="213" cy="29" r="1.2" fill="#ffffff" opacity="0.8" />
</svg>
