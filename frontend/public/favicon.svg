<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Outer Rim Gradient -->
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a9ba8" />
      <stop offset="35%" stop-color="#4a5568" />
      <stop offset="70%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Inner Face Gradient -->
    <radialGradient id="facePlate" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="60%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#0a0e14" />
    </radialGradient>

    <!-- Diode Glow -->
    <radialGradient id="diodeGlow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#00f0ff" />
      <stop offset="70%" stop-color="#0088cc" />
      <stop offset="100%" stop-color="#003355" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="skeuoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Outer Bezel -->
  <circle cx="32" cy="32" r="30" fill="url(#metalRim)" filter="url(#skeuoShadow)" stroke="#2d3748" stroke-width="1.5" />
  
  <!-- Inset Bezel Chamfer -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.8" />
  <circle cx="32" cy="32" r="24" fill="url(#facePlate)" />

  <!-- Screw Rivets -->
  <circle cx="32" cy="11" r="1.5" fill="#a0aec0" />
  <circle cx="32" cy="53" r="1.5" fill="#4a5568" />
  <circle cx="11" cy="32" r="1.5" fill="#718096" />
  <circle cx="53" cy="32" r="1.5" fill="#4a5568" />

  <!-- Tactile Aperture Grid Lines -->
  <path d="M 18 32 L 46 32 M 32 18 L 32 46" stroke="#00f0ff" stroke-width="1.2" opacity="0.3" stroke-dasharray="2,2" />

  <!-- Center Illuminated Status Diode -->
  <circle cx="32" cy="32" r="9" fill="url(#diodeGlow)" stroke="#00f0ff" stroke-width="1" />
  <circle cx="30" cy="30" r="3.5" fill="#ffffff" opacity="0.65" />
</svg>